<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="ui.title">Sổ tay Chuỗi Xung MRI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen text-slate-800">

    <!-- Header Module -->
    <header class="glass-header text-white shadow-lg flex-shrink-0 sticky top-0 z-30 border-b border-blue-900/50">
        <div class="w-full lg:w-11/12 xl:w-5/6 mx-auto py-3 px-4 sm:px-6 flex flex-col sm:flex-row justify-between sm:items-center">
            
            <div class="flex justify-between items-center w-full sm:w-auto">
                <div class="flex items-center space-x-3"> 
                    <img src="https://i.postimg.cc/W4hBVnSC/image.png" alt="Logo" class="h-11 w-11 rounded-full border-2 border-blue-300/50 shadow-sm hidden sm:block object-cover" onerror="this.style.display='none'">
                    <div> 
                        <h1 class="text-lg sm:text-2xl font-bold tracking-tight" data-lang-key="ui.title">Sổ tay Chuỗi Xung MRI</h1>
                        <p class="text-xs sm:text-sm text-blue-200 font-medium" data-lang-key="ui.subtitle">Dành cho Kỹ thuật viên Hình ảnh Y học</p> 
                    </div> 
                </div> 
                <button id="mobile-menu-button" class="sm:hidden p-2 rounded-lg text-blue-100 hover:bg-blue-700 transition-colors focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>

            <div class="text-left sm:text-right w-full sm:w-auto mt-3 sm:mt-0">
                <p class="hidden sm:block text-sm font-semibold text-blue-50 tracking-wide" data-lang-key="ui.group_name">Nhóm KTV Hình ảnh y học 3 Miền</p>
                <div class="mt-2 flex flex-row flex-wrap items-center justify-start sm:justify-end gap-3">
                    <img src="https://i.postimg.cc/W4hBVnSC/image.png" alt="Logo Mobile" class="h-8 w-8 rounded-full border-2 border-blue-300/50 shadow-sm block sm:hidden object-cover" onerror="this.style.display='none'">
                    <a href="https://vnrad.tech/" target="_blank" rel="noopener noreferrer" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xs font-semibold py-1.5 px-3 rounded-full transition-all duration-200 backdrop-blur-sm" data-lang-key="ui.vnrad_home">VnRad.tech</a>
                    <a href="https://vnrad.tech/mriprotocol/" target="_blank" rel="noopener noreferrer" class="bg-white text-blue-900 hover:bg-blue-50 text-xs font-bold py-1.5 px-3 rounded-full transition-all duration-200 shadow-sm" data-lang-key="ui.mri_protocol">MRI Protocol</a>
                    
                    <div class="flex items-center space-x-2 ml-2 border-l border-blue-700/50 pl-3">
                        <img id="lang-vi" src="https://flagcdn.com/w20/vn.png" alt="Tiếng Việt" class="lang-btn w-7 h-5 rounded-sm object-cover shadow-sm active">
                        <img id="lang-en" src="https://flagcdn.com/w20/gb.png" alt="English" class="lang-btn w-7 h-5 rounded-sm object-cover shadow-sm">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="w-full lg:w-11/12 xl:w-5/6 mx-auto py-6 px-4 sm:px-6 md:flex md:space-x-8 md:flex-1 relative">
        
        <!-- Sidebar Navigation -->
        <nav id="sidebar-nav" class="fixed inset-0 z-20 bg-slate-50/95 backdrop-blur-md p-6 pt-24 overflow-y-auto hidden md:block md:relative md:inset-auto md:w-72 md:bg-transparent md:backdrop-blur-none md:p-0 md:pt-0 md:sidebar-sticky md:max-h-[calc(100vh-8rem)]">
            <!-- Rendered via JS -->
        </nav>

        <!-- Content Area -->
        <div class="flex-1 flex flex-col w-full min-w-0">
            <!-- Search Bar -->
            <div class="mb-6 sticky top-[4.5rem] z-10 bg-slate-50/90 backdrop-blur-sm pt-2 pb-4 border-b border-slate-200">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên chuỗi xung, tên hãng, ứng dụng..." data-lang-key="ui.search_placeholder" class="w-full pl-10 pr-4 py-2.5 text-sm bg-white border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
            </div>

            <!-- Sequence Grid -->
            <div id="sequence-container" class="pb-10">
                <!-- Rendered via JS -->
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 bg-white text-center py-6 text-slate-500 text-sm">
        <div data-lang-key="ui.footer_copyright" class="font-medium">© 2026 Sổ tay MRI. Tài liệu chỉ mang tính chất tham khảo.</div>
        <div class="mt-1 text-slate-400 text-xs" data-lang-key="ui.footer_designer">Thiết kế tối ưu giao diện & hệ thống</div>
    </footer>
    
    <!-- Utilities: To Top & Lightbox -->
    <button id="scrollToTopBtn" class="hidden fixed bottom-8 right-8 bg-blue-600 text-white p-3.5 rounded-full shadow-xl hover:bg-blue-700 hover:-translate-y-1 transition-all duration-300 z-40 focus:outline-none focus:ring-4 focus:ring-blue-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>
    </button>

    <div id="lightbox" class="hidden fixed inset-0 z-50 bg-slate-900/95 flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <button id="lightbox-close" class="absolute top-6 right-6 text-slate-300 hover:text-white text-4xl p-2 focus:outline-none">&times;</button>
        <img id="lightbox-img" src="" alt="Zoomed" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl ring-1 ring-white/10 object-contain">
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
