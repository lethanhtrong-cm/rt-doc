<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nền Tảng Đào Tạo & Hướng Dẫn Y Khoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">Medical<span>Guide</span></div>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Ngân hàng đề</a>
            <a href="#">CT Scanner</a>
            <a href="#">MRI</a>
        </nav>
        <!-- Nút chuyển đổi Dark Mode -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Đổi giao diện Sáng/Tối">
            <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="sun-icon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </header>

    <!-- Layout Bento Box -->
    <section class="hero-bento-section">
        <div class="bento-grid">
            <div id="module-quiz" class="bento-panel bg-soft-blue"></div>
            <div id="module-ct" class="bento-panel bg-soft-teal"></div>
            <div id="module-mri-seq" class="bento-panel bg-white outline-border"></div>
            <div id="module-mri-proto" class="bento-panel bg-white outline-border"></div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
