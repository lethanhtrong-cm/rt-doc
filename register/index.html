<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Hội Thảo Khoa Học Y Khoa</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="registration-container" id="form-container">
            <div class="header-section">
                <div class="icon-medical">+</div>
                <h2>Hội Thảo Khoa Học</h2>
                <p>Đăng ký để nhận liên kết tham dự trực tuyến</p>
            </div>
            
            <form id="registration-form">
                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" name="fullName" placeholder="VD: Nguyễn Văn A" required>
                </div>

                <div class="form-group">
                    <label for="workplace">Đơn vị công tác</label>
                    <input type="text" id="workplace" name="workplace" placeholder="VD: Bệnh viện Đa khoa tỉnh..." required>
                </div>

                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" name="email" placeholder="VD: email@hospital.vn" required>
                </div>

                <div class="form-group">
                    <label for="qualification">Trình độ chuyên môn</label>
                    <select id="qualification" name="qualification" required>
                        <option value="" disabled selected>-- Chọn trình độ --</option>
                        <option value="BS">Bác sĩ</option>
                        <option value="ThS">Thạc sĩ / Bác sĩ CKI</option>
                        <option value="TS">Tiến sĩ / Bác sĩ CKII</option>
                        <option value="KTV">Kỹ thuật viên</option>
                        <option value="DD">Điều dưỡng</option>
                        <option value="Khac">Khác</option>
                    </select>
                </div>

                <div id="error-message" class="error-text"></div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    Đăng Ký Tham Dự
                </button>
            </form>
        </div>
    </div>

    <!-- Nạp file JS chính theo dạng ES6 Module -->
    <script type="module" src="main.js"></script>
</body>
</html>
